services:
  agent-api:
    environment:
      OPENAI_API_KEY: ${OPENROUTER_API_KEY:?Set OPENROUTER_API_KEY in the root .env file}
      OPENAI_BASE_URL: https://openrouter.ai/api/v1
      RESEARCH_MODEL: ${OPENROUTER_RESEARCH_MODEL:-openai:openai/gpt-4.1-mini}
      SUMMARIZATION_MODEL: ${OPENROUTER_SUMMARIZATION_MODEL:-openai:openai/gpt-4.1-mini}
      RESEARCH_MODEL_MAX_TOKENS: ${OPENROUTER_RESEARCH_MODEL_MAX_TOKENS:-2048}
      SUMMARIZATION_MODEL_MAX_TOKENS: ${OPENROUTER_SUMMARIZATION_MODEL_MAX_TOKENS:-2048}
      MAX_REACT_TOOL_CALLS: ${OPENROUTER_MAX_REACT_TOOL_CALLS:-6}
