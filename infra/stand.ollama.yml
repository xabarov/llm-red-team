services:
  ollama:
    image: ollama/ollama:0.11.11
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama-pull:
    image: ollama/ollama:0.11.11
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull qwen3:1.7b"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  agent-api:
    environment:
      OPENAI_API_KEY: ollama-local
      OPENAI_BASE_URL: http://ollama:11434/v1
      RESEARCH_MODEL: openai:qwen3:1.7b
      SUMMARIZATION_MODEL: openai:qwen3:1.7b
    depends_on:
      ollama-pull:
        condition: service_completed_successfully

volumes:
  ollama_data:

